<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Auth App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="tabs">
        <button class="tabBtn active" data-tab="profileTab">Profile</button>
        <button class="tabBtn" data-tab="chatTab">Chat</button>
        <button class="tabBtn" id="usersTabBtn" data-tab="usersTab" style="display:none;">Users</button>
        <button id="logoutBtn">Logout</button>
      </div>

      <!-- Profile tab -->
      <div id="profileTab" class="tabContent">
        <div id="profile">Loading...</div>

        <h3>Update Profile</h3>
        <form id="updateProfileForm">
          <input type="text" id="updateName" placeholder="Name">
          <input type="email" id="updateEmail" placeholder="Email">
          <button type="submit">Update</button>
        </form>
      </div>

      <!-- Chat tab -->
      <div id="chatTab" class="tabContent" style="display:none;">
        <div id="chatBox" style="height:300px; overflow-y:auto; border:1px solid #ddd; padding:10px;"></div>
        <form id="chatForm">
          <input type="text" id="chatInput" placeholder="Type a message..." required>
          <button type="submit">Send</button>
        </form>
      </div>

      <!-- Users tab (admin only) -->
      <div id="usersTab" class="tabContent" style="display:none;">
        <div id="userList"></div>
      </div>

      <p id="message"></p>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
